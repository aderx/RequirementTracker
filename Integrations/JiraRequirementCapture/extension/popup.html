<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>需求记录</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="shell">
    <header class="brand-header">
      <span class="brand-name">需求记录</span>
      <div class="brand-tools">
        <span class="brand-caption">Jira · GitLab</span>
        <div id="statusMenuContainer" class="status-menu-container hidden">
          <button id="statusMenuButton" type="button" class="status-menu-button" aria-label="切换需求状态" aria-expanded="false" aria-controls="statusMenu">状态 ▾</button>
          <div id="statusMenu" class="status-menu hidden" role="group" aria-label="需求状态切换">
            <div id="statusMenuItems"></div>
            <p id="statusMenuHint" class="status-menu-hint hidden"></p>
          </div>
        </div>
      </div>
    </header>
    <section class="status-card" aria-live="polite">
      <div id="iconFrame" class="icon-frame blue">
        <canvas id="badgeIconCanvas" class="badge-icon-canvas hidden" width="96" height="96" aria-hidden="true"></canvas>
        <span id="statusIcon" class="icon-symbol" aria-hidden="true">✓</span>
      </div>

      <div class="status-copy">
        <h1 id="titleText">需求记录</h1>
        <p id="statusText">正在识别当前页面...</p>
      </div>
    </section>

    <section id="summaryPanel" class="info-card hidden" aria-label="识别结果"></section>

    <section id="listVisibilityPanel" class="list-visibility-card hidden" aria-label="列表显示">
      <div>
        <span id="listVisibilityLabel" class="list-visibility-label">显示悬浮状态</span>
        <p>仅当前页面有效，刷新后恢复开启。</p>
      </div>
      <button id="listVisibilitySwitch" class="visibility-switch" type="button" role="switch" aria-checked="true" aria-labelledby="listVisibilityLabel" disabled></button>
    </section>

    <section id="statusReasonPanel" class="reason-card hidden" aria-live="polite">
      <span id="statusReasonLabel" class="reason-label"></span>
      <span id="statusReasonText" class="reason-value"></span>
    </section>

    <section id="manualPanel" class="manual-card hidden" aria-label="手动输入">
      <label for="manualJiraInput">关联 Jira 需求</label>
      <input id="manualJiraInput" type="text" placeholder="ZSTAC-12345 或完整 Jira 链接">
    </section>

    <section id="statusActionPanel" class="manual-card hidden" aria-label="状态操作">
      <label id="statusActionLabel" for="statusActionReason"></label>
      <textarea id="statusActionReason" rows="3"></textarea>
    </section>

    <section id="actions" class="actions hidden" aria-label="操作"></section>

    <span id="countdownText" class="sr-only"></span>
  </main>

  <script src="badge-renderer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
